<style>/* Customer page (/phone, /phone?embed=1 and the offline export). Productionised from
   design/v2/customer.html; the look is unchanged except the focus ring and the WhatsApp hand-off. */

/* ==========================================================================
   Tokens
   ========================================================================== */
:root {
  --paper: #ffffff;
  --wash: #f2f1ee;
  --ink: #161616;
  --ink-2: #5c5953;
  --line: #e3e0da;
  --honey: #e3a82b;
  --honey-ink: #7d5600;
  --open: #1f7a4a;
  --closed: #b42318;
  --stage: #e9e8e4;

  /* derived */
  --focus: var(--honey-ink); /* honey on white is only 2.1:1 */
  --line-strong: #d3cec5;
  --user-bg: var(--ink);
  --user-fg: var(--paper);
  --send-bg: var(--ink);
  --send-fg: var(--paper);
  --raise: 0 1px 2px rgb(22 22 22 / .05), 0 24px 44px -24px rgb(22 22 22 / .34);
  --sheet-shadow: 0 -16px 40px -16px rgb(12 11 10 / .32);
  --scrim: rgb(12 11 10 / .48);

  /* Over photos: the photos look the same in both themes, so these do not flip. */
  --photo-ink: #ffffff;
  --photo-ink-2: rgb(255 255 255 / .88);
  --glass: rgb(14 13 12 / .5);
  --glass-line: rgb(255 255 255 / .18);
  --photo-honey: #efb941;
  --photo-closed: #ff8a80;
  --photo-floor: #0c0b0a;

  --font-body: "Heebo", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  --font-display: "Karantina", "Heebo", system-ui, sans-serif;
  --font-mark: "Cormorant Garamond", Garamond, "Times New Roman", serif; /* Latin wordmark only */
  --ease: cubic-bezier(.2, .8, .2, 1);
  --col: 480px;
  --r-sheet: 22px;
  --r-card: 14px;
  --r-input: 12px;
  --r-pill: 999px;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121110;
    --wash: #1b1a18;
    --ink: #f3f1ed;
    --ink-2: #aaa59c;
    --line: #2d2b28;
    --honey: #efb941;
    --honey-ink: #efb941;
    --open: #5cc48b;
    --closed: #ff8a80;
    --stage: #0b0b0a;
    --focus: var(--honey);
    --line-strong: #3b3834;
    --user-bg: var(--honey);
    --user-fg: #161616;
    --send-bg: var(--honey);
    --send-fg: #161616;
    --raise: 0 0 0 1px var(--line), 0 28px 50px -24px rgb(0 0 0 / .8);
    --sheet-shadow: 0 0 0 1px var(--line), 0 -16px 40px -16px rgb(0 0 0 / .7);
    --scrim: rgb(0 0 0 / .62);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121110;
  --wash: #1b1a18;
  --ink: #f3f1ed;
  --ink-2: #aaa59c;
  --line: #2d2b28;
  --honey: #efb941;
  --honey-ink: #efb941;
  --open: #5cc48b;
  --closed: #ff8a80;
  --stage: #0b0b0a;
  --focus: var(--honey);
  --line-strong: #3b3834;
  --user-bg: var(--honey);
  --user-fg: #161616;
  --send-bg: var(--honey);
  --send-fg: #161616;
  --raise: 0 0 0 1px var(--line), 0 28px 50px -24px rgb(0 0 0 / .8);
  --sheet-shadow: 0 0 0 1px var(--line), 0 -16px 40px -16px rgb(0 0 0 / .7);
  --scrim: rgb(0 0 0 / .62);
  color-scheme: dark;
}

/* ==========================================================================
   Base
   ========================================================================== */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; background: var(--paper); scrollbar-gutter: stable; }
html.sheet-open { overflow: hidden; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
img, svg { display: block; }
img { max-width: 100%; }
button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
h1, h2, h3, p { margin: 0; }
p { text-wrap: pretty; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
/* Over the photo the page tokens do not apply: the photo looks the same in both themes. */
.hero :focus-visible { outline-color: var(--photo-honey); }
.vh {
  position: absolute !important;
  width: 1px; height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

/* The page is a phone-width column; on wider screens it sits centred on the wash. */
.page {
  max-width: var(--col);
  margin-inline: auto;
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--paper);
  overflow-x: clip;
}
@media (min-width: 560px) {
  body { background: var(--wash); }
  .page { box-shadow: 0 0 0 1px var(--line); }
}

/* Inside the laptop's phone frame (?embed=1, class set in <head>): no scrollbars and no
   search pill, the laptop shows the search preview in its own tab. */
.embed,
.embed * { scrollbar-width: none; }
.embed::-webkit-scrollbar,
.embed ::-webkit-scrollbar { display: none; }
.embed .search-pill { display: none; }

/* ==========================================================================
   Nameplate + hero. Together they fill ~74svh (as in the approved first-screen
   preview), so the question options still show on the first screen at 390x844.
   ========================================================================== */
.top {
  display: flex;
  flex-direction: column;
  height: 74vh;
  height: 74svh;
  min-height: 420px;
  max-height: 860px;
}
/* Short screens (small phones, the laptop's phone frame): a shorter hero keeps the questions in view.
   250px is what the card needs under the hero for its head, the greeting and two rows of options, so
   all four questions arrive on the first screen (the laptop's frame is ~600px tall at 1366x768). */
@media (max-height: 760px) {
  .top {
    height: 68vh;
    height: min(68svh, calc(100svh - 250px));
    min-height: 320px;
  }
}

/* Nameplate: a typeset name on paper, no marks or ornaments. */
.plate {
  flex: none;
  padding: 22px 16px 16px;
  background: var(--paper);
  border-block-end: 1px solid var(--line);
  text-align: center;
}
.plate-name { font-size: 15px; font-weight: 400; line-height: 1.4; }
.wordmark {
  display: block;
  padding-inline-start: .18em; /* the tracking after the last letter, mirrored so the word stays optically centred */
  color: var(--ink);
  font-family: var(--font-mark);
  font-weight: 600;
  font-size: 30px;
  line-height: 1;
  letter-spacing: .18em;
  word-spacing: .12em;
  text-transform: uppercase;
}
.plate-he,
.plate-sub {
  display: block;
  margin-block-start: 6px;
  color: var(--ink-2);
  font-size: 13px;
  line-height: 1.4;
  overflow-wrap: anywhere;
}
/* No wordmark for the current name (the laptop form changed the name): the Hebrew name leads. */
.plate.is-plain .plate-he {
  margin: 0;
  color: var(--ink);
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 34px;
  line-height: 1;
}

.hero {
  position: relative;
  isolation: isolate;
  flex: 1 1 auto;
  min-height: 0;
  overflow: hidden;
  background: var(--photo-floor);
  color: var(--photo-ink);
}
.hero-img {
  position: absolute;
  inset: 0;
  z-index: -2;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 88% 50%; /* geometry: crop tuned for the current hero photo */
}
.hero-shade {
  position: absolute;
  inset: 0;
  z-index: -1;
  background:
    linear-gradient(to bottom, rgb(12 11 10 / .5) 0%, rgb(12 11 10 / .1) 24%, rgb(12 11 10 / .1) 100%),
    linear-gradient(to top, var(--photo-floor) 0%, rgb(12 11 10 / .93) 24%, rgb(12 11 10 / .55) 48%, rgb(12 11 10 / 0) 72%);
}
.hero-bar {
  position: absolute;
  inset-block-start: 0;
  inset-inline: 0;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: max(14px, env(safe-area-inset-top)) 16px 0;
}
.status-pill,
.search-pill {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  border-radius: var(--r-pill);
  background: var(--glass);
  border: 1px solid var(--glass-line);
  color: var(--photo-ink);
  font-size: 13px;
  font-weight: 500;
  line-height: 1.3;
  -webkit-backdrop-filter: blur(12px) saturate(1.3);
  backdrop-filter: blur(12px) saturate(1.3);
}
.status-pill { gap: 8px; padding-inline: 12px 14px; }
.status-dot {
  flex: none;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--photo-honey);
}
.status-pill.is-closed .status-dot { background: var(--photo-closed); }
.search-pill {
  position: relative;
  gap: 6px;
  padding-inline: 12px 14px;
  cursor: pointer;
  transition: background-color .15s ease;
}
/* The pill is 36px to sit with the status pill; its tap area is 44px. */
.search-pill::after {
  content: "";
  position: absolute;
  inset: -4px;
}
.search-pill:hover { background: rgb(14 13 12 / .68); }
.search-pill:active { transform: scale(.97); }

.hero-copy {
  position: absolute;
  inset-inline: 0;
  inset-block-end: 0;
  padding: 0 20px 68px;
}
/* What the business is (the part of `type` before "·"); the name itself lives in the nameplate. */
.hero-kind {
  width: fit-content;
  max-width: 100%;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(46px, 13.3vw, 56px);
  line-height: .95;
  text-wrap: balance;
  overflow-wrap: anywhere;
}
.hero-sub {
  width: fit-content;
  max-width: 100%;
  margin-block-start: 10px;
  font-size: 15px;
  line-height: 1.5;
  color: var(--photo-ink-2);
}
.hero-sub span { white-space: nowrap; }

/* ==========================================================================
   Assistant card
   ========================================================================== */
.assistant {
  position: relative;
  z-index: 2;
  container: assistant / inline-size;
  margin: -40px 16px 0;
  padding: 18px;
  background: var(--paper);
  border-radius: var(--r-card);
  box-shadow: var(--raise);
}
.assistant-head { display: flex; align-items: center; gap: 12px; }
.avatar {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  object-fit: cover;
  flex: none;
  background: var(--wash);
}
.avatar-wrap { position: relative; flex: none; }
.avatar-wrap::after {
  content: "";
  position: absolute;
  inset-block-end: 0;
  inset-inline-end: 0;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--honey);
  box-shadow: 0 0 0 2.5px var(--paper);
}
.assistant-title { font-size: 16px; font-weight: 500; line-height: 1.3; }
.assistant-sub { font-size: 13px; color: var(--ink-2); line-height: 1.4; }
.assistant-thread {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  margin-block-start: 14px;
}
/* The typing dots sit in the greeting's place; the greeting keeps its space, so nothing below moves. */
.assistant .card-typing {
  display: none;
  position: absolute;
  inset-block-start: 0;
  inset-inline-start: 0;
}

/* Bubbles (shared by the card and the chat) */
.bubble {
  max-width: 86%;
  padding: 10px 14px;
  border-radius: 18px;
  font-size: 15px;
  line-height: 1.55;
  white-space: pre-line;
  overflow-wrap: anywhere;
}
.bubble--bot {
  align-self: flex-start;
  background: var(--wash);
  color: var(--ink);
  border-end-start-radius: 6px;
}
.bubble--user {
  align-self: flex-end;
  background: var(--user-bg);
  color: var(--user-fg);
  border-end-end-radius: 6px;
}
.assistant .bubble { max-width: 100%; }

.typing {
  display: inline-flex;
  align-self: flex-start;
  gap: 5px;
  padding: 15px 16px;
  background: var(--wash);
  border-radius: 18px;
  border-end-start-radius: 6px;
}
.typing i {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--ink-2);
  opacity: .45;
}

/* Question options */
.options {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-block-start: 14px;
}
.option,
.chip {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  padding-inline: 16px;
  border: 1px solid var(--line-strong);
  border-radius: var(--r-pill);
  background: var(--paper);
  color: var(--ink);
  font-size: 15px;
  font-weight: 500;
  line-height: 1.3;
  cursor: pointer;
  transition: border-color .15s ease, background-color .15s ease, transform .12s ease;
}
.option:hover, .chip:hover { border-color: var(--honey); }
/* Narrow cards (360px phones, or a classic scrollbar eating the width): keep two options per row. */
@container assistant (max-width: 309px) {
  .options { gap: 7px; }
  .option { padding-inline: 12px; font-size: 14px; }
}
.option:active, .chip:active { transform: scale(.96); background: var(--wash); }

/* Input-looking buttons (card and sticky bar) */
.ask {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: 52px;
  margin-block-start: 14px;
  padding-block: 6px;
  padding-inline: 16px 6px;
  border: 1px solid var(--line);
  border-radius: var(--r-input);
  background: var(--wash);
  color: var(--ink-2);
  font-size: 15px;
  text-align: start;
  cursor: text;
}
.ask-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.send-dot,
.send {
  display: grid;
  place-items: center;
  flex: none;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--send-bg);
  color: var(--send-fg);
}

/* ==========================================================================
   Sections
   ========================================================================== */
.section { padding: 56px 20px; }
.section--wash { background: var(--wash); }
.assistant + .section { padding-block-start: 52px; }
.section-head {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: 6px 16px;
  margin-block-end: 18px;
}
.section-title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 40px;
  line-height: .95;
  text-wrap: balance;
}
.section > .section-title { margin-block-end: 18px; }
.section-head .section-title { margin: 0; }

/* Price list with dotted leaders */
.prices { list-style: none; margin: 0; padding: 0; }
.price-row {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding-block: 9px;
  font-size: 16px;
}
.price-name { min-width: 0; overflow-wrap: anywhere; }
.price-leader {
  flex: 1 1 24px;
  min-width: 24px;
  border-block-end: 2px dotted var(--line-strong);
  transform: translateY(-.3em); /* geometry: lifts the dots to mid-letter height */
}
.price {
  flex: none;
  font-weight: 700;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.price-from { font-weight: 400; color: var(--ink-2); }

/* Hours */
.live-status {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  font-weight: 500;
}
.live-status::before {
  content: "";
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: currentColor;
}
.is-open-text { color: var(--open); }
.is-closed-text { color: var(--closed); }
.hours { list-style: none; margin: 0; padding: 0; }
.hours-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding-block: 14px;
  border-block-end: 1px solid var(--line-strong);
  font-size: 16px;
}
.hours-row:first-child { border-block-start: 1px solid var(--line-strong); }
.hours-day { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.hours-time { font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; }
.hours-row.is-shut .hours-time { font-weight: 400; color: var(--ink-2); }
.hours-row.is-today .hours-day { font-weight: 700; }
.today-tag {
  padding: 1px 10px;
  border-radius: var(--r-pill);
  background: var(--honey);
  color: #161616;
  font-size: 13px;
  font-weight: 500;
  line-height: 1.7;
}

/* About */
.portrait {
  position: relative;
  margin: 0;
  aspect-ratio: 4 / 5;
  border-radius: var(--r-card);
  overflow: hidden;
  background: var(--wash);
}
.portrait img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 50% 0%;
  filter: grayscale(1);
}
/* Legibility, not decoration: the crop can put the light backdrop behind the title's edge. */
.portrait::after {
  content: "";
  position: absolute;
  inset-inline: 0;
  inset-block-end: 0;
  height: 42%;
  background: linear-gradient(to top, rgb(12 11 10 / .7), rgb(12 11 10 / 0));
  pointer-events: none;
}
.portrait-title,
.photo-chip { z-index: 1; }
.portrait-title {
  position: absolute;
  inset-block-end: 18px;
  inset-inline-start: 20px;
  color: var(--photo-ink);
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 56px;
  line-height: .9;
}
.photo-chip {
  position: absolute;
  inset-block-start: 14px;
  inset-inline-start: 14px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  max-width: calc(100% - 28px);
  padding-block: 6px;
  padding-inline: 12px 14px;
  border-radius: var(--r-pill);
  background: var(--glass);
  border: 1px solid var(--glass-line);
  color: var(--photo-ink);
  font-size: 13px;
  font-weight: 500;
  line-height: 1.35;
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
}
.photo-chip::before {
  content: "";
  flex: none;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--photo-honey);
}
.lead { margin-block-start: 22px; font-size: 17px; line-height: 1.65; }

/* How to get here */
.place-photo {
  position: relative;
  aspect-ratio: 16 / 10;
  border-radius: var(--r-card);
  overflow: hidden;
  background: var(--line);
}
.place-photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform: scale(1.8);
  transform-origin: 9% 74%; /* geometry: a closer crop of the same photo, tuned for it */
}
.visit { list-style: none; margin: 8px 0 0; padding: 0; }
.visit-item {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  padding-block: 16px;
  border-block-end: 1px solid var(--line-strong);
}
.visit-item:last-child { border-block-end: 0; }
.visit-icon {
  display: grid;
  place-items: center;
  flex: none;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--paper);
  color: var(--ink);
}
.visit-label { font-size: 13px; color: var(--ink-2); line-height: 1.4; }
.visit-value { margin-block-start: 2px; font-size: 16px; line-height: 1.5; }

/* Footer */
.footer {
  padding: 28px 20px calc(108px + env(safe-area-inset-bottom));
  text-align: center;
  color: var(--ink-2);
  font-size: 13px;
}

/* ==========================================================================
   Sticky ask bar
   ========================================================================== */
.askbar {
  position: fixed;
  inset-inline: 0;
  inset-block-end: 0;
  z-index: 20;
  padding: 10px 16px max(12px, env(safe-area-inset-bottom));
  visibility: hidden;
  transform: translateY(calc(100% + 16px));
  transition: transform .32s var(--ease), visibility 0s linear .32s;
}
.askbar.is-visible {
  visibility: visible;
  transform: none;
  transition: transform .32s var(--ease), visibility 0s;
}
.askbar .ask {
  max-width: calc(var(--col) - 32px);
  margin: 0 auto;
  background: var(--paper);
  box-shadow: var(--raise);
}

/* ==========================================================================
   Sheets
   ========================================================================== */
.scrim {
  position: fixed;
  inset: 0;
  z-index: 30;
  background: var(--scrim);
  opacity: 0;
  transition: opacity .32s ease;
}
.scrim.is-open { opacity: 1; }
.sheet {
  position: fixed;
  z-index: 40;
  inset-inline: 0;
  inset-block-end: var(--kb, 0px);
  width: 100%;
  max-width: var(--col);
  margin-inline: auto;
  display: flex;
  flex-direction: column;
  background: var(--paper);
  border-start-start-radius: var(--r-sheet);
  border-start-end-radius: var(--r-sheet);
  box-shadow: var(--sheet-shadow);
  transform: translateY(104%);
  transition: transform .32s var(--ease);
  outline: none;
}
.sheet.is-open { transform: none; }
.sheet.is-dragging,
.sheet.is-instant,
.scrim.is-instant { transition: none; }
.sheet--chat {
  height: 92vh;
  height: min(92dvh, calc(var(--vvh, 100dvh) - 12px));
}
.sheet--search {
  max-height: 92vh;
  max-height: min(92dvh, calc(var(--vvh, 100dvh) - 12px));
}
.sheet-head {
  flex: none;
  padding: 8px 16px 12px;
  border-block-end: 1px solid var(--line);
  touch-action: none;
  cursor: grab;
  user-select: none;
}
.sheet.is-dragging .sheet-head { cursor: grabbing; }
.grab {
  display: block;
  width: 40px;
  height: 5px;
  margin: 0 auto 10px;
  border-radius: var(--r-pill);
  background: var(--line-strong);
}
.sheet-row { display: flex; align-items: center; gap: 12px; }
.sheet-id { flex: 1; min-width: 0; }
.sheet-title { font-size: 16px; font-weight: 500; line-height: 1.3; }
.sheet-sub { margin-block-start: 2px; font-size: 13px; color: var(--ink-2); line-height: 1.4; }
.sheet-title--display {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 34px;
  line-height: 1;
  padding-block-start: 4px;
}
.sheet .avatar { width: 40px; height: 40px; }
.icon-btn {
  display: grid;
  place-items: center;
  flex: none;
  width: 44px;
  height: 44px;
  border: 0;
  border-radius: 50%;
  background: var(--wash);
  color: var(--ink);
  cursor: pointer;
}
.icon-btn:active { transform: scale(.94); }

/* Chat */
.log {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 14px 16px 12px;
}
.day-sep {
  align-self: center;
  margin-block-end: 8px;
  padding: 2px 12px;
  border-radius: var(--r-pill);
  background: var(--wash);
  color: var(--ink-2);
  font-size: 13px;
  line-height: 1.6;
}
.log .bubble--user { margin-block-start: 10px; }

/* WhatsApp hand-off: a primary button under the reply, the pre-typed message under it. */
.handoff {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-block-start: 4px;
}
.wa-btn {
  box-sizing: border-box;
  display: flex;
  align-items: center;
  text-decoration: none;
  justify-content: center;
  gap: 10px;
  width: 100%;
  min-height: 48px;
  padding: 10px 16px;
  border: 0;
  border-radius: var(--r-input);
  background: var(--send-bg);
  color: var(--send-fg);
  font-size: 15px;
  font-weight: 500;
  line-height: 1.3;
  cursor: pointer;
  transition: transform .12s ease;
}
.wa-btn svg { flex: none; }
.wa-btn:active { transform: scale(.98); }
.wa-preview {
  margin-inline-start: 6px;
  padding-inline-start: 10px;
  border-inline-start: 2px solid var(--line-strong);
  color: var(--ink-2);
  font-size: 13px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}
/* What the button turns into once pressed. */
.fwd {
  align-self: flex-start;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  min-height: 48px;
  padding-inline-start: 6px;
  color: var(--ink-2);
  font-size: 13px;
  line-height: 1.5;
}
.fwd.is-sent::before {
  content: "";
  flex: none;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--honey);
}
.chips {
  flex: none;
  display: flex;
  gap: 8px;
  overflow-x: auto;
  overscroll-behavior-x: contain;

@keyframes settle { from { transform: scale(1.06); } }
/* clip-path insets are physical (top right bottom left): a left inset of 100%
   shrinking to 0 reveals each line from its right edge leftward. */
@keyframes reveal {
  from { clip-path: inset(-30% -6% -30% 100%); }
  to   { clip-path: inset(-30% -6% -30% -6%); }
}
@keyframes fade-up { from { opacity: 0; transform: translateY(10px); } }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(28px); } }
@keyframes bubble-in { from { opacity: 0; transform: translateY(8px) scale(.98); } }
@keyframes pop {
  0%   { opacity: 0; transform: translateY(10px) scale(.9); }
  60%  { opacity: 1; transform: translateY(-1px) scale(1.02); }
  100% { opacity: 1; transform: none; }
}
@keyframes blink { 0%, 60%, 100% { opacity: .3; transform: none; } 30% { opacity: .9; transform: translateY(-2px); } }
@keyframes pulse {

  70%, 100% { box-shadow: 0 0 0 7px rgb(239 185 65 / 0); }
}

.intro .hero-img   { animation: settle 1.4s var(--ease) backwards; }
.intro .hero-bar   { animation: fade .6s ease .5s backwards; }
.intro .reveal     { animation: reveal .8s cubic-bezier(.6, 0, .2, 1) backwards; animation-delay: calc(200ms + var(--i) * 120ms); }

  /* Before first paint: ?theme=light|dark, ?embed=1 (inside the laptop frame), and whether the
     load sequence plays. It is skipped under reduced motion and when ?sheet= opens a sheet on load. */
  (function () {
    var q = new URLSearchParams(location.search);
    var root = document.documentElement;
    var theme = q.get('theme');
    if (theme === 'light' || theme === 'dark') {
      root.setAttribute('data-theme', theme);
      document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
        m.removeAttribute('media');
        m.setAttribute('content', theme === 'dark' ? '#121110' : '#ffffff');
      });
    }
    if (q.get('embed') === '1') root.classList.add('embed');
    var still = window.matchMedia('(prefers-reduced-motion: reduce)').matches || q.get('sheet');
    if (!still) root.classList.add('intro');
  })();

<script>/* Keyword engine for the browser: a port of engine/text.py, hours.py, contact.py, replies.py and

    if (word.length > 2 && PREFIXES.has(word[0])) {
      cands.push(word.slice(1));
      if (word.length > 3 && PREFIXES.has(word[1])) cands.push(word.slice(2));
    }
    const out = new Set();
    for (const c of cands) {
      out.add("w:" + c);
      const s = stem(c);
      if (s.length >= 3) out.add("s:" + s);
    }
    return out;
  }

  function keyForms(word) {
    const out = new Set(["w:" + word]);
    const s = stem(word);
    if (s.length >= 3) out.add("s:" + s);
    return out;
  }

  function withinOneEdit(a, b) {
    if (a === b) return true;
    if (Math.abs(a.length - b.length) > 1) return false;
    if (a.length > b.length) [a, b] = [b, a];
    let i = 0, j = 0, edits = 0;
    while (i < a.length && j < b.length) {
      if (a[i] === b[j]) { i++; j++; continue; }
      if (++edits > 1) return false;
      if (a.length === b.length) i++;
      j++;
    }
    return edits + (b.length - j) + (a.length - i) <= 1;
  }

  function matches(word, key) {
    const wf = wordForms(word), kf = keyForms(key);
    for (const f of wf) if (kf.has(f)) return true;
    if (key.length >= 5) {
      for (const f of wf) {
        if (f.startsWith("w:") && f.length - 2 >= 5 && withinOneEdit(f.slice(2), key)) return true;
      }
    }
    return false;
  }

  function isOneOf(word, set) {
    if (set.has(word)) return true;
    for (const f of wordForms(word)) {
      if (f.startsWith("w:") && set.has(f.slice(2)) && f.length - 2 >= 3) return true;
    }
    return false;
  }

  const contentWords = text => tokens(text).filter(w => !isDigits(w) && !isOneOf(w, FUNCTION_WORDS));
  const topicWords = text => contentWords(text).filter(w => !isOneOf(w, GENERIC_WORDS));

  // ---- hours ------------------------------------------------------------------------------
  const DAY_KEYS = ["sun", "mon", "tue", "wed", "thu", "fri", "sat"];
  const DAY_NAMES = ["ראשון", "שני", "שלישי", "רביעי", "חמישי", "שישי", "שבת"];
  const DAY_LETTERS = "אבגדהוש";
  const DAY_RE = () => /(שלישי|חמישי|ראשון|רביעי|שישי|שני|שבת)|(^|[^א-ת])([אבגדהוש])(?![א-ת])/g;
  const RANGE_RE = () => /(\d{1,2})(?:[:.](\d{2}))?\s*(?:[-–—]|עד)\s*(\d{1,2})(?:[:.](\d{2}))?/g;
  const DASH_RE = /[-–—]|עד/;

  const hhmm = (h, m) => String(parseInt(h, 10)).padStart(2, "0") + ":" + (m || "00");
  const dayIndex = tok => DAY_NAMES.includes(tok) ? DAY_NAMES.indexOf(tok) : DAY_LETTERS.indexOf(tok);

  function ranges(seg) {
    const out = [];
    for (const m of seg.matchAll(RANGE_RE())) {
      const [, a, b, c, d] = m;
      if (+a <= 24 && +c <= 24 && (b || d || seg.includes("–") || seg.includes("-"))) out.push([hhmm(a, b), hhmm(c, d)]);
    }
    return out;
  }

  function daysIn(part) {
    const found = [...part.matchAll(DAY_RE())].map(m => {
      const tok = m[1] || m[3];
      const start = m[1] ? m.index : m.index + m[2].length;
      return [tok, start, m.index + m[0].length];
    });
    const days = [];
    found.forEach(([tok, start], i) => {
      const d = dayIndex(tok);
      if (i > 0 && DASH_RE.test(part.slice(found[i - 1][2], start))) {
        const first = days[days.length - 1], span = (d - first + 7) % 7;
        for (let k = 1; k <= span; k++) days.push((first + k) % 7);
      } else days.push(d);
    });
    return days;
  }

  function parseHoursText(text) {
    const clean = String(text || "").replace(/[׳'’`]/g, " ");
    const schedule = {};
    let lastDays = [], pending = [];
    for (const seg of clean.split(/[·•|;\n,]/)) {
      const rs = ranges(seg);
      const first = rs.length ? seg.search(/\d{1,2}(?:[:.]\d{2})?\s*(?:[-–—]|עד)\s*\d/) : -1;
      const closed = seg.includes("סגור");
      const cuts = [first, seg.indexOf("סגור")].filter(i => i >= 0);
      const cut = cuts.length ? Math.min(...cuts) : seg.length;
      let days = daysIn(seg.slice(0, cut));
      if (!rs.length && !closed) { pending.push(...days); continue; }
      if (!days.length && !pending.length) {
        if (rs.length && lastDays.length) for (const d of lastDays) (schedule[d] = schedule[d] || []).push(...rs);
        continue;
      }
      days = pending.concat(days);
      pending = [];
      for (const d of days) schedule[d] = rs.map(r => r.slice());
      lastDays = days;
    }
    return schedule;
  }

  const fmtRanges = rs => rs.map(([a, b]) => `${a}–${b}`).join(", ");

  function scheduleFromJson(hours) {
    const schedule = {};
    for (const [key, value] of Object.entries(hours || {})) {
      const parts = key.split("-");
      if (!parts.every(p => DAY_KEYS.includes(p))) continue;
      const a = DAY_KEYS.indexOf(parts[0]), b = DAY_KEYS.indexOf(parts[parts.length - 1]);
      const rs = ranges(value || "");
      for (let k = 0; k <= (b - a + 7) % 7; k++) schedule[(a + k) % 7] = rs;
    }
    return schedule;
  }

  const scheduleOf = cfg => (cfg.hours_text || "").trim() ? parseHoursText(cfg.hours_text) : scheduleFromJson(cfg.hours);
  const has = (schedule, d) => Object.prototype.hasOwnProperty.call(schedule, d);

  function scheduleToJson(schedule) {
    const out = {};
    let d = 0;
    while (d < 7) {
      if (!has(schedule, d)) { d++; continue; }
      let end = d;
      while (end + 1 < 7 && has(schedule, end + 1) && fmtRanges(schedule[end + 1]) === fmtRanges(schedule[d])) end++;
      out[end === d ? DAY_KEYS[d] : `${DAY_KEYS[d]}-${DAY_KEYS[end]}`] = fmtRanges(schedule[d]) || null;
      d = end + 1;
    }
    return out;
  }

  /** The hours line the owner's per-day editor writes, e.g. "א׳–ה׳ 07:30–19:30 · ו׳ 09:00–13:00 · שבת סגור".
      schedule: {dayIndex: [[open, close], ...] or [] for closed}; days left out are left out of the text. */
  function hoursTextFromSchedule(schedule) {
    const label = d => (d === 6 ? "שבת" : `${DAY_LETTERS[d]}׳`);
    const parts = [];
    let d = 0;
    while (d < 7) {
      if (!has(schedule, d)) { d++; continue; }
      let end = d;
      while (end + 1 < 7 && has(schedule, end + 1) && fmtRanges(schedule[end + 1]) === fmtRanges(schedule[d])) end++;
      const days = end === d ? label(d) : `${DAY_LETTERS[d]}׳–${DAY_LETTERS[end]}׳`;
      parts.push(`${days} ${fmtRanges(schedule[d]) || "סגור"}`);
      d = end + 1;
    }
    return parts.join(" · ");
  }

  /** {day: 0..6 (Sunday=0), hm: "HH:MM"} in Israel time. */
  function nowIL(date) {
    const parts = {};
    for (const p of new Intl.DateTimeFormat("en-US", { timeZone: "Asia/Jerusalem", weekday: "short", hour: "2-digit", minute: "2-digit", hourCycle: "h23" })
      .formatToParts(date || new Date())) parts[p.type] = p.value;
    return { day: ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].indexOf(parts.weekday), hm: `${parts.hour}:${parts.minute}` };
  }

  function openNow(schedule, now) {
    if (!has(schedule, now.day)) return [null, null];
    for (const [a, b] of schedule[now.day]) if (a <= now.hm && now.hm < b) return [true, b];
    return [false, null];
  }

  function nextOpening(schedule, now) {
    for (let ahead = 0; ahead < 8; ahead++) {
      const day = (now.day + ahead) % 7;
      for (const [a] of schedule[day] || []) if (ahead > 0 || a > now.hm) return [day, a, ahead];
    }
    return null;
  }

  // ---- phone numbers -------------------------------------------------------------------------
  const PHONE_RE = /^(?:\+?972[-\s]?|0)(?:(?:5\d|7\d)[-\s]?\d{3}[-\s]?\d{4}|[23489][-\s]?\d{3}[-\s]?\d{4})$/;

  function normalizePhone(raw) {
    if (!raw || !PHONE_RE.test(String(raw).trim())) return null;
    let digits = String(raw).replace(/\D/g, "");
    if (digits.startsWith("972")) digits = "0" + digits.slice(3);
    const prefix = "57".includes(digits[1]) ? 3 : 2;
    return `${digits.slice(0, prefix)}-${digits.slice(prefix)}`;
  }

  /** "050-1234567" -> "972501234567" for wa.me links; "" if the number is not valid. */
  function international(raw) {
    const display = normalizePhone(raw || "");
    return display ? "972" + display.replace(/\D/g, "").slice(1) : "";
  }

  // ---- replies ------------------------------------------------------------------------------
  // The assistant never books and never guesses: bookings and unanswerable questions get a button
  // that opens WhatsApp to the owner with the customer's message already typed.
  const KINDS = { booking: "בקשה לתור", open: "שאלה פתוחה" };

  const greeting = cfg => `היי! כאן העוזר של ${cfg.name}. אפשר לשאול על שעות, מחירים ושירותים. את התורים ${cfg.owner_first_name} קובע בעצמו, בוואטסאפ.`;

  function handoffText(cfg, forward, partial) {
    const owner = cfg.owner_first_name;
    if (forward === "booking") return `את התורים ${owner} קובע בעצמו. אפשר לשלוח לו את הבקשה בוואטסאפ, ההודעה כבר מוכנה.`;
    const lead = partial ? "על השאר אני מעדיף לא לנחש." : "את זה אני מעדיף לא לנחש.";
    return `${lead} אפשר לשאול את ${owner} ישירות בוואטסאפ, ההודעה כבר מוכנה.`;
  }

  function whatsapp(cfg, message) {
    const owner = cfg.owner_first_name;
    const text = `היי ${owner}! ${String(message).trim()}`;
    const number = international(cfg.owner_whatsapp || "");
    // encodeURIComponent leaves !'()* alone; quote() in replies.py escapes "!" too, so match it.
    const url = number ? `https://wa.me/${number}?text=${encodeURIComponent(text).replace(/[!'()*]/g, c => "%" + c.charCodeAt(0).toString(16).toUpperCase())}` : "";
    return { label: `שליחה ל${owner} בוואטסאפ`, text, url };
  }

  function compose(cfg, answer, forward) {
    if (!forward) return answer;
    return (answer ? `${answer}\n` : "") + handoffText(cfg, forward, !!answer);
  }

  // ---- keyword engine -----------------------------------------------------------------------
  const GREETINGS = vocab("שלום היי הי הלו אהלן hi hello hey בוקר ערב צהריים טוב טובים מה נשמע קורה שלומך שלומכם");
  const THANKS = vocab("תודה רבה תודות סבבה מעולה אחלה אוקיי אוקי ok יופי נהדר מצוין");
  const HOURS_WORDS = vocab("פתוח פתוחים פתוחה פתוחות סגור סגורים סגורה שעות נפתח נפתחים נסגר נסגרים פועל פועלים פעילות מתי");
  const WORKING = vocab("עובדים עובד עובדת");
  const NOW_WORDS = vocab("עכשיו כרגע");
  const TODAY = normalize("היום"), TOMORROW = normalize("מחר"), DAY_AFTER = normalize("מחרתיים");
  const WEEKEND = vocab("סופש סוף");
  const ADDRESS_WORDS = vocab("כתובת איפה מיקום ממוקמים נמצאים מגיעים הגעה רחוב וויז waze מפה");
  const CONTACT_WORDS = vocab("טלפון וואטסאפ ווטסאפ ווצאפ whatsapp להתקשר נייד פלאפון");
  const INSTAGRAM = vocab("אינסטגרם אינסטה instagram"), FACEBOOK = vocab("פייסבוק facebook");
  const PRICE_WORDS = vocab("מחיר מחירים מחירון עולה עולים עולות עלות תעריף שח שקל שקלים כמה");
  const PRICE_NEUTRAL = new Set([...PRICE_WORDS, ...vocab(`שיער קצר ארוך בן בת בעלי אשתי שלי שלנו עכשיו היום בערך בממוצע סהכ גם עוד פעם
    אחד אחת לראש מלא אצלכם`)]);
  const BOOK_STEMS = ["קבוע", "קבע", "תאמ", "הזמנ", "להזמי", "שריינ", "פנוי", "פנויה", "פנויימ", "פנויות", "דחופ", "בהקדמ"];
  const COME = vocab("לבוא להגיע לקפוץ לגשת");
  const BOOK_PHRASES = ["יש מקום", "מקום פנוי", "לשמור לי", "להגיע ב", "לבוא ב"].map(normalize);
  const TURN = normalize("תור");
  const CLOCK_RE = /(?:^|\D)\d{1,2}:\d{2}(?!\d)|(?:^|\s)(?:ב-?|בשעה\s*)\d{1,2}(?!\d)/;
  const DAY_LETTER_RE = () => /יום\s*([אבגדהוש])['׳’]?(?![א-ת])/g;
  const DAY_NAMES_N = DAY_NAMES.map(normalize);

  const surface = w => [...wordForms(w)].filter(f => f.startsWith("w:")).map(f => f.slice(2));
  const hits = (words, keys) => words.some(w => surface(w).some(f => keys.has(f)));

  function daysMentioned(text, words, now) {
    const out = [];
    const today = now.day;
    for (const w of words) {
      const forms = new Set(surface(w));
      if (forms.has(TODAY) && w !== normalize("יום")) out.push([today, "today"]);
      else if (forms.has(TOMORROW)) out.push([(today + 1) % 7, "tomorrow"]);
      else if (forms.has(DAY_AFTER)) out.push([(today + 2) % 7, "day"]);
      else if ([...forms].some(f => WEEKEND.has(f))) out.push([5, "day"], [6, "day"]);
      else DAY_NAMES_N.forEach((name, i) => { if (forms.has(name)) out.push([i, "day"]); });
    }
    for (const m of text.matchAll(DAY_LETTER_RE())) out.push([DAY_LETTERS.indexOf(m[1]), "day"]);
    const seen = new Set();
    return out.filter(([d]) => !seen.has(d) && seen.add(d));
  }

  function isBooking(text, words, hasDay, hoursQ) {
    const n = normalize(text);
    const explicit = words.some(w => BOOK_STEMS.some(s => w.includes(s))) || BOOK_PHRASES.some(p => n.includes(p));
    const turn = words.some(w => { const f = wordForms(w); return f.has("w:" + TURN) || f.has("s:" + TURN); });
    if (explicit || turn) return true;
    if (hits(words, COME) && (hasDay || hits(words, NOW_WORDS) || CLOCK_RE.test(text))) return true;
    if (hoursQ) return false;
    const timed = CLOCK_RE.test(text);
    const asks = hits(words, vocab("אפשר"));
    if (timed && (hasDay || asks)) return true;
    if (asks && hasDay) return true;
    const rest = contentWords(text).filter(w => !isDigits(w));
    return timed && hasDay && rest.length <= 2;
  }

  function hoursAnswer(cfg, text, words, now) {
    const schedule = scheduleOf(cfg);
    const hoursText = cfg.hours_text || "";
    if (hits(words, NOW_WORDS)) {
      const [isOpen, closes] = openNow(schedule, now);
      if (isOpen === null) return `שעות הפעילות: ${hoursText}`;
      if (isOpen) return `כן, אנחנו פתוחים עכשיו, עד ${closes}.`;
      const nxt = nextOpening(schedule, now);
      if (!nxt) return `כרגע סגור. שעות הפעילות: ${hoursText}`;
      const [day, at, ahead] = nxt;
      const when = ahead === 0 ? "היום" : ahead === 1 ? "מחר" : `ביום ${DAY_NAMES[day]}`;
      return `כרגע סגור. נפתחים שוב ${when} ב-${at}.`;
    }
    const days = daysMentioned(text, words, now);
    if (!days.length || days.some(([d]) => !has(schedule, d))) return `שעות הפעילות: ${hoursText}`;
    return days.map(([d, how]) => {
      const name = DAY_NAMES[d];
      const when = how === "today" ? `היום (יום ${name})` : how === "tomorrow" ? `מחר (יום ${name})` : d === 6 ? "בשבת" : `ביום ${name}`;
      if (schedule[d].length) return `${days.length === 1 ? "כן, " : ""}${when} אנחנו פתוחים ${fmtRanges(schedule[d])}.`;
      return `${when} אנחנו סגורים.${days.length === 1 ? reopen(schedule, d) : ""}`;
    }).join(" ");
  }

  function reopen(schedule, closedDay) {
    for (let k = 1; k < 7; k++) {
      const day = (closedDay + k) % 7;
      if ((schedule[day] || []).length) return ` נפתחים שוב ביום ${DAY_NAMES[day]} ב-${schedule[day][0][0]}.`;
    }
    return "";
  }

  const priceLine = s => `${s.name} — ${s.from ? "מ-" : ""}${s.price} ₪`;
  const keysOf = name => contentWords(name).filter(k => !isDigits(k));

  function priceAnswer(cfg, text, priceQ) {
    const words = contentWords(text);
    const services = (cfg.services || []).filter(s => s.name);
    const scored = [];
    for (const s of services) {
      const keys = keysOf(s.name);
      const hit = keys.filter(k => words.some(w => matches(w, k))).length;
      if (hit) scored.push([hit, hit / keys.length, s]);
    }
    const serviceKeys = new Set(services.flatMap(s => contentWords(s.name)));
    const unknown = topicWords(text).filter(w => ![...serviceKeys].some(k => matches(w, k)) && !surface(w).some(f => PRICE_NEUTRAL.has(f)));
    if (!scored.length) {
      if (unknown.length || !priceQ) return unknown.length ? { answer: "", forward: "open" } : null;
      const listed = services.filter(s => s.price != null).map(priceLine);
      return listed.length ? { answer: "המחירון:\n" + listed.join("\n"), forward: null } : { answer: "", forward: "open" };
    }
    if (!priceQ && unknown.length) return { answer: "", forward: "open" };
    const best = Math.max(...scored.map(x => x[0]));
    let top = scored.filter(x => x[0] === best);
    if (top.some(x => x[1] === 1)) top = top.filter(x => x[1] === 1);
    const priced = top.map(x => x[2]).filter(s => s.price != null);
    if (!priced.length) return { answer: "", forward: "open" };
    return { answer: (priceQ ? "" : "כן. ") + priced.map(priceLine).join("\n"), forward: unknown.length ? "open" : null };
  }

  function faqStrong(cfg, text) {
    const msg = contentWords(text);
    for (const item of cfg.faq || []) {
      const keys = contentWords(item.q || "");
      if (!keys.length) continue;
      if (keys.every(k => msg.some(w => matches(w, k)))) {
        const extra = msg.filter(w => !keys.some(k => matches(w, k)));
        if (extra.length <= 1) return item.a || "";
      }
    }
    return null;
  }

  function faqWeak(cfg, text) {
    const msg = topicWords(text);
    let best = 0, answer = null;
    for (const item of cfg.faq || []) {
      const qKeys = topicWords(item.q || ""), aKeys = topicWords(item.a || "").filter(k => k.length >= 3);
      const score = 2 * msg.filter(w => qKeys.some(k => matches(w, k))).length + msg.filter(w => aKeys.some(k => matches(w, k))).length;
      if (score > best) { best = score; answer = item.a || ""; }
    }
    return best ? answer : null;
  }

  function contactAnswer(cfg, words) {
    const parts = [];
    if (hits(words, INSTAGRAM) && cfg.instagram) parts.push(`אינסטגרם: @${cfg.instagram}`);
    if (hits(words, FACEBOOK) && cfg.facebook) parts.push(`פייסבוק: ${cfg.facebook}`);
    if (!parts.length || hits(words, CONTACT_WORDS)) parts.unshift(`אפשר לכתוב כאן, או בוואטסאפ ובטלפון ${cfg.owner_whatsapp || ""}`);
    return parts.join(". ") + ".";
  }

  /** {answer, forward: null|"booking"|"open", summary} — the same shape as engine.keywords.Result. */
  function respond(cfg, message, now) {
    now = now || nowIL();
    const R = (answer, forward) => ({ answer: answer || "", forward: forward || null, summary: "" });
    const text = String(message || "").trim().slice(0, 500);
    const words = tokens(text);
    if (!words.length) return R("אפשר לשאול על שעות, מחירים ושירותים.");
    const content = contentWords(text);
    if (words.every(w => GREETINGS.has(w) || THANKS.has(w))) {
      if (words.some(w => THANKS.has(w)) && !words.some(w => GREETINGS.has(w) && !THANKS.has(w))) return R("בשמחה! אם יש עוד שאלה, אני כאן.");
      return R(greeting(cfg));
    }
    const days = daysMentioned(text, words, now);
    const hoursQ = hits(words, HOURS_WORDS) || (hits(words, NOW_WORDS) && !CLOCK_RE.test(text)) || (hits(words, WORKING) && days.length > 0);

    const strong = faqStrong(cfg, text);
    if (strong && !CLOCK_RE.test(text)) return R(strong);
    if (isBooking(text, words, days.length > 0, hoursQ)) return R("", "booking");
    if (hoursQ) return R(hoursAnswer(cfg, text, words, now));
    if (hits(words, new Set([...CONTACT_WORDS, ...INSTAGRAM, ...FACEBOOK]))) return R(contactAnswer(cfg, words));
    if (hits(words, ADDRESS_WORDS) || (hits(words, vocab("להגיע")) && !days.length)) return R(`הכתובת: ${cfg.address || ""}.`);
    const priceQ = hits(words, new Set([...PRICE_WORDS].filter(w => w !== normalize("כמה")))) || (hits(words, vocab("כמה")) && !hits(words, vocab("זמן")));
    const namesService = content.some(w => (cfg.services || []).some(s => contentWords(s.name || "").some(k => matches(w, k))));
    if (priceQ || namesService) {
      const priced = priceAnswer(cfg, text, priceQ);
      if (priced) return Object.assign(R(), priced);
    }
    const weak = faqWeak(cfg, text);
    if (weak) return R(weak);
    return R("", "open");
  }

  // ---- helpers for the views ----------------------------------------------------------------
  function serviceToLine(s) {
    return s.price == null ? s.name : `${s.name} — ${s.from ? "מ-" : ""}${s.price} ₪`;
  }

  /** One service per line: "name — price ₪", "name — מ-price ₪", or the spec's plain "name price". */
  function lineToService(line) {
    const t = line.trim();
    if (!t) return null;
    const m = /^(.*?)(\s*[—–\-:|·]\s*|\s+)(מ-|מ־|החל מ-?|החל מ\s*)?(\d[\d,]*)\s*(₪|ש"ח|ש״ח|שח|שקלים|שקל)?\s*$/.exec(t);
    if (!m) return { name: t, price: null };
    const [, name, sep, from, num, cur] = m;
    const plainSep = !/[—–\-:|·]/.test(sep);
    // "תספורת ילדים עד 12" is a name, not a price of 12.
    if (plainSep && !cur && !from && /(?:^|\s)(?:עד|גיל|מעל|מתחת ל?|מגיל)$/.test(name)) return { name: t, price: null };
    if (!name.trim()) return { name: t, price: null };
    const s = { name: name.trim(), price: parseInt(num.replace(/,/g, ""), 10) };
    if (from) s.from = true;
    return s;
  }

  const servicesToText = services => (services || []).map(serviceToLine).join("\n");
  const textToServices = text => String(text || "").split("\n").map(lineToService).filter(Boolean);
  const faqToText = faq => (faq || []).map(f => `${f.q} | ${f.a}`).join("\n");
  const textToFaq = text => String(text || "").split("\n").map(l => l.split("|")).filter(p => p.length >= 2)
    .map(([q, ...a]) => ({ q: q.trim(), a: a.join("|").trim() })).filter(f => f.q && f.a);

  const city = cfg => { const p = String(cfg.address || "").split(","); return p.length > 1 ? p[p.length - 1].trim() : ""; };
  const typeParts = cfg => String(cfg.type || "").split("·").map(s => s.trim());

  /** The 1-2 sentence search-result description, written from the data. */
  function describe(cfg) {
    const [kind, audience] = typeParts(cfg);
    const where = city(cfg) ? ` ב${city(cfg)}` : "";
    const first = `${kind}${where}${audience ? `, ל${audience}` : ""}.`;
    const heads = [];
    for (const s of cfg.services || []) {
      const head = String(s.name || "").split(/\s+/)[0];
      if (head && !heads.includes(head)) heads.push(head);
    }
    let second = heads.length > 1 ? `${heads.slice(0, -1).join(", ")} ו${heads[heads.length - 1]}` : heads.join("");
    if (cfg.brand_note) second = second ? `${second} — ${cfg.brand_note}` : cfg.brand_note;
    return second ? `${first} ${second}.` : first;
  }

  /** Four quick questions taken from the hours, the first price and the first FAQ items. */
  function chips(cfg) {
    const schedule = scheduleOf(cfg);
    const open = Object.keys(schedule).map(Number).filter(d => schedule[d].length);
    const minutes = d => schedule[d].reduce((t, [a, b]) => t + (toMin(b) - toMin(a)), 0);
    const shortest = open.sort((a, b) => minutes(a) - minutes(b) || a - b)[0];
    const out = [shortest != null && open.length > 1 ? `פתוח ב${DAY_NAMES[shortest]}?` : "מה שעות הפתיחה?"];
    const firstService = (cfg.services || []).find(s => s.name && s.price != null);
    if (firstService) out.push(`כמה עולה ${firstService.name}?`);
    for (const f of cfg.faq || []) if (out.length < 4 && f.q) out.push(f.q);
    return out.slice(0, 4);
  }
  const toMin = hm => +hm.slice(0, 2) * 60 + +hm.slice(3);

  /** {open: true|false|null, text} for the live status pill. */
  function openStatus(cfg, now) {
    now = now || nowIL();
    const schedule = scheduleOf(cfg);
    const [isOpen, closes] = openNow(schedule, now);
    if (isOpen === null) return { open: null, text: "" };
    if (isOpen) return { open: true, text: `פתוח עכשיו · עד ${closes}` };
    const nxt = nextOpening(schedule, now);
    if (!nxt) return { open: false, text: "סגור עכשיו" };
    const [day, at, ahead] = nxt;
    const when = ahead === 0 ? "היום" : ahead === 1 ? "מחר" : `ביום ${DAY_NAMES[day]}`;
    return { open: false, text: `סגור עכשיו · נפתח ${when} ב-${at}` };
  }

  /** Rows for an hours table: consecutive days with the same hours share a row. */
  function hoursRows(cfg, now) {
    now = now || nowIL();
    const schedule = scheduleOf(cfg);
    if (!Object.keys(schedule).length) return [{ days: cfg.hours_text || "", hours: "", today: false }];
    const rows = [];
    let d = 0;
    while (d < 7) {
      if (!has(schedule, d)) { d++; continue; }
      let end = d;
      while (end + 1 < 7 && has(schedule, end + 1) && fmtRanges(schedule[end + 1]) === fmtRanges(schedule[d])) end++;
      rows.push({ days: end === d ? DAY_NAMES[d] : `${DAY_NAMES[d]}–${DAY_NAMES[end]}`, hours: fmtRanges(schedule[d]) || "סגור",
        today: now.day >= d && now.day <= end });
      d = end + 1;
    }
    return rows;
  }

  const api = {
    normalize, tokens, contentWords, topicWords, matches, parseHoursText, scheduleToJson, scheduleOf, hoursTextFromSchedule, nowIL, openNow, nextOpening,
    normalizePhone, international, KINDS, greeting, compose, whatsapp, respond,
    servicesToText, textToServices, faqToText, textToFaq, describe, chips, openStatus, hoursRows, DAY_NAMES,
  };
  root.Engine = api;
  if (typeof module !== "undefined" && module.exports) module.exports = api;
})(typeof globalThis !== "undefined" ? globalThis : this);

<script>/* Customer page: the business's landing page with the assistant built in. Served at /phone (the QR),
   at /phone?embed=1 (the phone inside the laptop frame) and inlined as the offline export.
   Every business string comes from BOOT.config. Answers come from POST /chat, or from the shared
   keyword engine (window.Engine) when the server can't be reached or there is none.
   Contract: design/INTEGRATION.md. Copy and behaviour: design/BRIEF-v2.md. */
(function () {
  'use strict';

  /* ==========================================================================
     1. Environment and state
     ========================================================================== */
  const BOOT = window.BOOT || { mode: 'static', config: {}, version: 0, photos: {} };
  const params = new URLSearchParams(location.search);
  const EMBED = params.get('embed') === '1';
  const SERVER = BOOT.mode === 'server'; // "static" is the offline export: no network at all
  const SOURCE = EMBED ? 'laptop' : 'phone';
  const START_SHEET = ['chat', 'search'].includes(params.get('sheet')) ? params.get('sheet') : null;
  const PRODUCT = 'עסקים מקומיים חכמים';
  const PARKING = Engine.normalize('חניה');

  const state = {
    cfg: BOOT.config,
    version: BOOT.version,
    /* The wordmark is the owner's Latin spelling of one name, so it shows only while that name is
       current. If the owner's form renames the business, the Hebrew name leads the nameplate. */
    wordmarkFor: BOOT.config.name,
    questions: '',
  };

  const motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
  const reducedMotion = () => motionQuery.matches;
  const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
  const $ = (id) => document.getElementById(id);

  /* ==========================================================================
     2. DOM helpers. Text always goes in as text nodes, never as markup.
     ========================================================================== */
  /* h('p', {class: 'x', onclick: fn}, 'text', child, [children]) */
  function h(tag, props, ...children) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (const child of children.flat()) if (child != null && child !== false && child !== '') el.append(child);
    return el;
  }

  const SVG_NS = 'http://www.w3.org/2000/svg';
  const ICONS = {
    search: [['circle', { cx: 11, cy: 11, r: 6.5 }], ['path', { d: 'm20 20-4.2-4.2' }]],
    send: [['path', { d: 'M12 19V5' }], ['path', { d: 'm5.5 11.5 6.5-6.5 6.5 6.5' }]],
    chevronDown: [['path', { d: 'm6 9 6 6 6-6' }]],
    pin: [['path', { d: 'M12 21s-6.5-5.7-6.5-11a6.5 6.5 0 0 1 13 0c0 5.3-6.5 11-6.5 11Z' }], ['circle', { cx: 12, cy: 10, r: 2.4 }]],
    parking: [['rect', { x: 4, y: 4, width: 16, height: 16, rx: 4 }], ['path', { d: 'M10 16.5v-9h3.2a2.7 2.7 0 0 1 0 5.4H10' }]],
    phone: [['path', { d: 'M6.6 3.5h2.6l1.6 4.3-2.1 1.4a10.6 10.6 0 0 0 6.1 6.1l1.4-2.1 4.3 1.6v2.6a2 2 0 0 1-2.2 2A16.2 16.2 0 0 1 4.6 5.7a2 2 0 0 1 2-2.2Z' }]],
    camera: [['rect', { x: 3.5, y: 6.5, width: 17, height: 13, rx: 3 }], ['path', { d: 'M8.5 6.5 10 4h4l1.5 2.5' }], ['circle', { cx: 12, cy: 13, r: 3.3 }]],
    clock: [['circle', { cx: 12, cy: 12, r: 8.5 }], ['path', { d: 'M12 7.5V12l3 2' }]],
    /* A plain speech bubble for the WhatsApp hand-off: neutral on purpose, never the WhatsApp mark. */
    message: [['path', { d: 'M6 4.5h12A2.5 2.5 0 0 1 20.5 7v8a2.5 2.5 0 0 1-2.5 2.5h-7.5L6 21v-3.5A2.5 2.5 0 0 1 3.5 15V7A2.5 2.5 0 0 1 6 4.5Z' }],
      ['path', { d: 'M8 9.5h8' }], ['path', { d: 'M8 13h5' }]],
  };

  function svg(tag, attrs) {
    const el = document.createElementNS(SVG_NS, tag);
    for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
    return el;
  }

  function icon(name, size = 20) {
    const el = svg('svg', {
      viewBox: '0 0 24 24', width: size, height: size, fill: 'none', stroke: 'currentColor', 'stroke-width': 1.85,
      'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'aria-hidden': 'true', focusable: 'false',
    });
    for (const [tag, attrs] of ICONS[name]) el.append(svg(tag, attrs));
    return el;
  }

  /* Time ranges and @handles read left to right inside Hebrew text (07:30–19:30, not 19:30–07:30);
     everything else stays plain text. Returns nodes and strings for h() or replaceChildren(). */
  const LTR_RE = /\d{1,2}:\d{2}\s?[–—-]\s?\d{1,2}:\d{2}|@[A-Za-z0-9_](?:[A-Za-z0-9_.]*[A-Za-z0-9_])?/g;
  function richText(text) {
    const s = String(text == null ? '' : text);
    const out = [];
    let last = 0;
    for (const m of s.matchAll(LTR_RE)) {
      if (m.index > last) out.push(s.slice(last, m.index));
      out.push(h('span', { dir: 'ltr' }, m[0]));
      last = m.index + m[0].length;
    }
    if (last < s.length) out.push(s.slice(last));
    return out;
  }

  function hydrateIcons() {
    document.querySelectorAll('[data-icon]').forEach((slot) => slot.replaceWith(icon(slot.dataset.icon, Number(slot.dataset.size) || 20)));
  }

  function hydratePhotos() {
    document.querySelectorAll('img[data-photo]').forEach((img) => {
      const src = (BOOT.photos || {})[img.dataset.photo];
      if (src) img.src = src;
    });
  }

  /* ==========================================================================
     3. Copy derived from the config
     ========================================================================== */
  function splitName(name) {
    const [brand, ...rest] = String(name || '').split(/\s+[–—-]\s+/);
    return { brand: brand.trim(), trade: rest.join(' – ').trim() };
  }
  function typeParts(type) {
    const [main, ...rest] = String(type || '').split(/\s*·\s*/);
    return { main: main.trim(), audience: rest.join(', ').trim() };
  }
  function cityOf(cfg) {
    const parts = String(cfg.address || '').split(',');
    return parts.length > 1 ? parts[parts.length - 1].trim() : '';
  }

  const copy = {
    audience: (c) => { const a = typeParts(c.type).audience; return !a || a.startsWith('ל') ? a : `ל${a}`; },
    cardTitle: (c) => `העוזר של ${c.owner_first_name}`,
    barLabel: (c) => `שאלו את העוזר של ${c.owner_first_name}…`,
    sheetTitle: (c) => `העוזר של ${splitName(c.name).brand}`,
    sheetSub: (c) => `עונה מיד · את התורים ${c.owner_first_name} קובע בוואטסאפ`,
    aboutTitle: (c) => `על ${c.owner_first_name}`,
    sent: (c) => `נשלח ל${c.owner_first_name} בוואטסאפ · ממתין לתשובה`,
    opened: (c) => `נפתח וואטסאפ עם ההודעה ל${c.owner_first_name}`,
    footer: (c) => [PRODUCT, cityOf(c), SERVER ? '' : 'דף הדגמה'].filter(Boolean).join(' · '),
    searchQuery: (c) => {
      const kind = typeParts(c.type).main.split(/\s+/)[0];
      const town = cityOf(c).split('-')[0].trim();
      return town ? `${kind} ב${town}` : kind;
    },
    resultNote: (c) => `כל מה שמופיע כאן נלקח מהטופס ש${c.owner_first_name} מילא.`,
  };

  /* {open: true|false|null, label, detail}. The pill says "עד 19:30" (Engine.openStatus as is);
     the hours section and the search card say when it closes, "נסגר ב-19:30". */
  function liveStatus(cfg, long) {
    const status = Engine.openStatus(cfg);
    const [label, ...rest] = status.text.split(' · ');
    let detail = rest.join(' · ');
    if (long && status.open) detail = `נסגר ב-${Engine.openNow(Engine.scheduleOf(cfg), Engine.nowIL())[1]}`;
    return { open: status.open, label, detail };
  }
  const joinStatus = ({ label, detail }) => (detail ? `${label} · ${detail}` : label);

  /* ==========================================================================
     4. Renderers: each owns one region of the page and reads only the config
     ========================================================================== */
  function renderNameplate(cfg) {
    const { brand, trade } = splitName(cfg.name);
    const mark = cfg.wordmark && cfg.name === (cfg.wordmark_name || state.wordmarkFor) ? cfg.wordmark : '';
    $('plate').classList.toggle('is-plain', !mark);
    $('wordmark').textContent = mark;
    $('wordmark').hidden = !mark;
    /* With the wordmark, line 2 is the Hebrew name with its dash turned into a middle dot. */
    $('plate-he').textContent = mark ? [brand, trade].filter(Boolean).join(' · ') : brand;
    $('plate-sub').textContent = mark ? '' : trade;
    $('plate-sub').hidden = Boolean(mark) || !trade;
    document.title = cfg.name || PRODUCT;
  }

  function renderHero(cfg) {
    /* The hero names the kind of business; the nameplate already names the business. */
    $('hero-kind').textContent = typeParts(cfg.type).main;
    /* Each part stays whole; when the line is too long the address moves down as one piece. */
    const parts = [copy.audience(cfg), cfg.address].filter(Boolean);
    $('hero-sub').replaceChildren(...parts.flatMap((part, i) => [i ? ' · ' : '', h('span', null, part)]).filter(Boolean));
    $('hero-img').alt = `${splitName(cfg.name).brand}, מבפנים`;
  }

  /* The four quick questions, as card options and as chat chips. */
  function questionButtons(questions, className, onPick) {
    return questions.map((q, i) => h('button', { class: className, type: 'button', style: `--i:${i}`, onclick: (e) => onPick(q, e.currentTarget) }, q));
  }

  function renderAssistant(cfg) {
    const greeting = Engine.greeting(cfg);
    $('assistant-title').textContent = copy.cardTitle(cfg);
    $('card-greeting').textContent = greeting;
    $('bar-ask-label').textContent = copy.barLabel(cfg);
    $('chat-title').textContent = copy.sheetTitle(cfg);
    $('chat-sub').textContent = copy.sheetSub(cfg);
    chat.greeting.textContent = greeting;

    const questions = Engine.chips(cfg);
    if (questions.join('\n') === state.questions) return; // unchanged: keep focus and the intro animation
    state.questions = questions.join('\n');
    $('card-options').replaceChildren(...questionButtons(questions, 'option', (q, button) => {
      openSheet('chat', { opener: button });
      ask(q);
    }));
    $('chips').replaceChildren(...questionButtons(questions, 'chip', (q) => ask(q)));
  }

  function renderPrices(cfg) {
    $('prices').replaceChildren(...(cfg.services || []).map((s) => {
      const name = h('span', { class: 'price-name' }, s.name);
      if (s.price == null) return h('li', { class: 'price-row' }, name);
      return h('li', { class: 'price-row' }, name,
        h('span', { class: 'price-leader', 'aria-hidden': 'true' }),
        h('span', { class: 'price' }, s.from ? h('span', { class: 'price-from' }, 'מ-') : null, `${Number(s.price).toLocaleString('he-IL')} ₪`));
    }));
  }

  function renderHours(cfg) {
    $('hours').replaceChildren(...Engine.hoursRows(cfg).map((row) => {
      const shut = row.hours === 'סגור';
      return h('li', { class: `hours-row${row.today ? ' is-today' : ''}${shut ? ' is-shut' : ''}` },
        h('span', { class: 'hours-day' }, richText(row.days), row.today ? h('span', { class: 'today-tag' }, 'היום') : null),
        row.hours ? h('span', { class: 'hours-time' }, richText(row.hours)) : null);
    }));
  }

  function fillResultStatus(el, status) {
    el.hidden = status.open === null;
    el.replaceChildren(h('b', { class: status.open ? 'is-open-text' : 'is-closed-text' }, status.label),
      ...richText(status.detail ? ` · ${status.detail}` : ''));
  }

  /* Open/closed: the hero pill, the hours section, the search card and the "today" row. */
  function renderStatus() {
    const cfg = state.cfg;
    const short = liveStatus(cfg, false);
    const long = liveStatus(cfg, true);

    const pill = $('hero-status');
    pill.hidden = short.open === null;
    pill.classList.toggle('is-open', short.open === true);
    pill.classList.toggle('is-closed', short.open === false);
    $('hero-status-text').replaceChildren(...richText(joinStatus(short)));

    const live = $('hours-status');
    live.hidden = long.open === null;
    live.className = `live-status ${long.open ? 'is-open-text' : 'is-closed-text'}`;
    live.replaceChildren(...richText(joinStatus(long)));

    fillResultStatus($('result-status'), long);
    renderHours(cfg);
  }

  function renderAbout(cfg) {
    $('about-title').textContent = copy.aboutTitle(cfg);
    $('portrait').alt = `דיוקן של ${cfg.owner_first_name}`;
    $('brand-note').textContent = cfg.brand_note || '';
    $('brand-note').hidden = !cfg.brand_note;
    $('about-text').textContent = cfg.about || '';
    $('about-text').hidden = !cfg.about;
  }

  function renderVisit(cfg) {
    const parking = (cfg.faq || []).find((f) => Engine.tokens(f.q || '').some((w) => Engine.matches(w, PARKING)));
    const rows = [
      cfg.address && { icon: 'pin', label: 'כתובת', value: cfg.address },
      parking && { icon: 'parking', label: 'חניה', value: parking.a },
      cfg.owner_whatsapp && { icon: 'phone', label: 'טלפון', value: cfg.owner_whatsapp },
      cfg.instagram && { icon: 'camera', label: 'אינסטגרם', value: richText(`@${cfg.instagram}`) },
    ].filter(Boolean);
    $('visit').replaceChildren(...rows.map((row) =>
      h('li', { class: 'visit-item' },
        h('span', { class: 'visit-icon' }, icon(row.icon, 20)),
        h('div', null,
          h('p', { class: 'visit-label' }, row.label),
          h('p', { class: 'visit-value' }, row.value)))));
  }

  function renderSearch(cfg) {
    $('search-query').textContent = copy.searchQuery(cfg);
    $('result').replaceChildren(
      h('h3', { class: 'result-name', id: 'result-name' }, cfg.name),
      h('p', { class: 'result-type' }, cfg.type),
      h('p', { class: 'result-status', id: 'result-status' }),
      h('ul', { class: 'result-facts' },
        h('li', null, icon('pin', 18), h('span', null, cfg.address)),
        h('li', null, icon('clock', 18), h('span', null, richText(cfg.hours_text)))),
      h('ul', { class: 'tags', 'aria-label': 'שירותים' }, (cfg.services || []).map((s) => h('li', null, s.name))),
      h('p', { class: 'result-desc' }, Engine.describe(cfg)));
    $('result-note').textContent = copy.resultNote(cfg);
  }

  function renderAll() {
    const cfg = state.cfg;
    renderNameplate(cfg);
    renderHero(cfg);
    renderAssistant(cfg);
    renderPrices(cfg);
    renderAbout(cfg);
    renderVisit(cfg);
    renderSearch(cfg);
    renderStatus();
    $('footer-text').textContent = copy.footer(cfg);
  }

  /* A new config from the laptop (embed) or from polling (/phone): re-render, leave the chat alone. */
  function applyConfig(config, version) {
    state.cfg = config;
    if (version != null) state.version = version;
    renderAll();
  }

  /* ==========================================================================
     5. Transport. Server mode only; the offline export never touches the network.
     ========================================================================== */
  async function api(path, body, { timeout = 8000, keepalive = false } = {}) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeout);
    try {
      const init = body === undefined ? { cache: 'no-store' }
        : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), keepalive };
      const res = await fetch(path, { ...init, signal: ctrl.signal });
      if (!res.ok) throw new Error(`${path}: ${res.status}`);
      return await res.json();
    } finally {
      clearTimeout(timer);
    }
  }

  function localAnswer(cfg, message) {
    const r = Engine.respond(cfg, message);
    return {
      reply: Engine.compose(cfg, r.answer, r.forward),
      forward: r.forward ? { kind: Engine.KINDS[r.forward], summary: r.summary, whatsapp: Engine.whatsapp(cfg, message) } : null,
    };
  }

  /* {reply, forward}. Any server trouble (network, 8 s timeout, non-2xx, odd body) is answered
     locally, silently: same bubble, same timing, nothing on screen about it. */
  async function answer(message) {
    const cfg = state.cfg;
    if (!SERVER) return localAnswer(cfg, message);
    try {
      const res = await api('/chat', { message, source: SOURCE });
      if (typeof res.reply !== 'string' || !res.reply) throw new Error('/chat: no reply');
      if (res.forward && !(res.forward.whatsapp && res.forward.whatsapp.text)) res.forward.whatsapp = Engine.whatsapp(cfg, message);
      return res;
    } catch (e) {
      return localAnswer(cfg, message);
    }
  }

  function postToParent(message) {
    if (EMBED && window.parent !== window) window.parent.postMessage(message, '*');
  }

  /* ==========================================================================
     6. Chat
     ========================================================================== */
  const chat = { log: $('log'), greeting: h('p', { class: 'bubble bubble--bot' }), queue: Promise.resolve() };

  function appendToLog(el) {
    el.classList.add('is-new');
    chat.log.append(el);
    chat.log.scrollTop = chat.log.scrollHeight;
    return el;
  }

  function ask(text) {
    const clean = String(text).trim().slice(0, 500);
    if (clean) chat.queue = chat.queue.then(() => exchange(clean)).catch(() => {});
  }

  async function exchange(text) {
    appendToLog(h('p', { class: 'bubble bubble--user' }, h('bdi', null, text)));
    const typing = appendToLog(h('div', { class: 'typing' }, h('span', { class: 'vh' }, 'העוזר מקליד…'), h('i'), h('i'), h('i')));
    /* The dots show for a random 500-800 ms, and for as long as the answer takes beyond that. */
    let res;
    try {
      [res] = await Promise.all([answer(text), wait(500 + Math.round(Math.random() * 300))]);
    } finally {
      typing.remove();
    }
    appendToLog(h('p', { class: 'bubble bubble--bot' }, richText(res.reply)));
    const box = res.forward && handoff(res.forward, text);
    if (box) appendToLog(box);
  }

  /* The WhatsApp hand-off: the owner books and answers himself, so the assistant offers a button
     that sends him the customer's message, already typed. */
  function handoff(forward, message) {
    const wa = forward.whatsapp;
    if (!EMBED && !wa.url) return null; // no valid owner number: nothing to open
    /* On a phone this is a real link (in-app browsers may block window.open); in the laptop frame a
       button, because the demo must never leave the page. */
    const control = EMBED
      ? h('button', { class: 'wa-btn', type: 'button' }, icon('message', 20), wa.label)
      : h('a', { class: 'wa-btn', href: wa.url, target: '_blank', rel: 'noopener' }, icon('message', 20), wa.label);
    control.addEventListener('click', () => sendToOwner(forward, message, control), { once: true });
    return h('div', { class: 'handoff' }, control, h('p', { class: 'wa-preview' }, h('bdi', null, wa.text)));
  }

  /* Pressable once. On a phone it opens WhatsApp; inside the laptop frame it never navigates and the
     laptop flies the message to the owner's phone. Server mode also records it (POST /forward). */
  function sendToOwner(forward, message, button) {
    const cfg = state.cfg;
    const wa = forward.whatsapp;
    const r = button.getBoundingClientRect();
    const from = { x: Math.round(r.left + r.width / 2), y: Math.round(r.top + r.height / 2) };
    const recorded = SERVER
      ? api('/forward', { kind: forward.kind, message, summary: forward.summary || '', source: SOURCE }, { timeout: 4000, keepalive: true })
        .then((res) => res.item || null, () => null)
      : Promise.resolve(null);

    const hadFocus = document.activeElement === button;
    const swap = () => {
      button.replaceWith(h('p', { class: EMBED ? 'fwd is-sent is-new' : 'fwd is-new' }, EMBED ? copy.sent(cfg) : copy.opened(cfg)));
      if (hadFocus) $('sheet-chat').focus({ preventScroll: true });
    };
    if (!EMBED) {
      setTimeout(swap, 0); // after the link's own navigation has started
      return;
    }
    swap();

    recorded.then((item) => postToParent({
      type: 'forward',
      item: Object.assign(item && item.id != null ? { id: item.id } : {}, {
        kind: forward.kind, message, text: (item && item.text) || wa.text, time: (item && item.time) || Engine.nowIL().hm,
      }),
      from,
    }));
  }

  /* ==========================================================================
     7. Sheets: one component, two instances
     ========================================================================== */
  const sheets = { current: null };
  const page = $('page');
  const scrim = $('scrim');

  function openSheet(name, { opener = null, focus = 'dialog', instant = false } = {}) {
    if (sheets.current) {
      if (sheets.current.name === name) return;
      closeSheet({ restoreFocus: false });
    }
    const el = $(`sheet-${name}`);
    sheets.current = { name, el, opener };
    syncViewport();
    el.classList.toggle('is-instant', instant);
    scrim.classList.toggle('is-instant', instant);
    el.hidden = false;
    scrim.hidden = false;
    el.getBoundingClientRect(); // commit the closed position so the slide runs
    el.classList.add('is-open');
    scrim.classList.add('is-open');
    page.inert = true;
    document.documentElement.classList.add('sheet-open');

    if (focus === 'input') $('compose-input').focus({ preventScroll: true });
    else if (focus === 'dialog') el.focus({ preventScroll: true });
    if (name === 'chat') chat.log.scrollTop = chat.log.scrollHeight;
    if (instant) requestAnimationFrame(() => requestAnimationFrame(() => {
      el.classList.remove('is-instant');
      scrim.classList.remove('is-instant');
    }));
  }

  function closeSheet({ restoreFocus = true } = {}) {
    const current = sheets.current;
    if (!current) return;
    sheets.current = null;
    const { el, opener } = current;
    el.classList.remove('is-open');
    el.style.transform = '';
    scrim.classList.remove('is-open');
    page.inert = false;
    document.documentElement.classList.remove('sheet-open');
    const finish = () => {
      if (!el.classList.contains('is-open')) el.hidden = true;
      if (!sheets.current) scrim.hidden = true;
    };
    if (reducedMotion()) finish(); else setTimeout(finish, 340);
    /* A config update can re-render the question that opened the chat; then the card's ask button takes focus. */
    if (restoreFocus && opener) {
      const target = opener.isConnected ? opener : $('card-ask');
      target.focus({ preventScroll: true });
    }
  }

  /* The grab handle is real: drag the header down to close. */
  function enableDragToClose(el) {
    const head = el.querySelector('.sheet-head');
    let drag = null;
    head.addEventListener('pointerdown', (e) => {
      if (e.target.closest('button') || (e.pointerType === 'mouse' && e.button !== 0)) return;
      drag = { y: e.clientY, t: performance.now(), dy: 0 };
      head.setPointerCapture(e.pointerId);
      el.classList.add('is-dragging');
    });
    head.addEventListener('pointermove', (e) => {
      if (!drag) return;
      drag.dy = Math.max(0, e.clientY - drag.y);
      el.style.transform = `translateY(${drag.dy}px)`;
    });
    const end = () => {
      if (!drag) return;
      const { dy, t } = drag;
      const velocity = dy / Math.max(1, performance.now() - t);
      drag = null;
      el.classList.remove('is-dragging');
      if (dy > 120 || (dy > 40 && velocity > 0.5)) closeSheet();
      else el.style.transform = '';
    };
    head.addEventListener('pointerup', end);
    head.addEventListener('pointercancel', end);
  }

  /* Keeps the chat's compose bar above an on-screen keyboard (iOS does not resize the layout viewport). */
  function syncViewport() {
    const vv = window.visualViewport;
    if (!vv) return;
    const root = document.documentElement.style;
    root.setProperty('--vvh', `${Math.round(vv.height)}px`);
    root.setProperty('--kb', `${Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop))}px`);
  }

  /* ==========================================================================
     8. Load sequence: name reveal, card rises, greeting types, questions arrive
     ========================================================================== */
  async function playIntro() {
    const root = document.documentElement;
    if (!root.classList.contains('intro')) return;
    const card = $('assistant');
    await wait(1250);
    card.classList.add('is-typing');
    await wait(700);
    card.classList.remove('is-typing');
    card.classList.add('is-greeted');
    await wait(320);
    card.classList.add('is-asking');
    await wait(4 * 80 + 600);
    root.classList.remove('intro');
  }

  /* Sticky ask bar: shown once the assistant card has scrolled up out of view. */
  function watchCard() {
    if (!('IntersectionObserver' in window)) return;
    const bar = $('askbar');
    new IntersectionObserver(([entry]) => {
      bar.classList.toggle('is-visible', !entry.isIntersecting && entry.boundingClientRect.bottom < 0);
    }).observe($('assistant'));
  }

  /* ==========================================================================
     9. Modes
     - embed: the laptop pushes {type: "config", config, version}; we say {type: "ready"} on load.
     - /phone on a real phone (server mode): poll GET /config every 2 s.
     ========================================================================== */
  function listenToParent() {
    window.addEventListener('message', (e) => {
      if (e.source !== window.parent) return;
      const data = e.data;
      if (data && data.type === 'config' && data.config && typeof data.config === 'object') applyConfig(data.config, data.version);
    });
  }

  function pollConfig() {
    let busy = false;
    setInterval(async () => {
      if (busy || document.hidden) return;
      busy = true;
      try {
        const res = await api('/config', undefined, { timeout: 4000 });
        if (res && res.config && res.version !== state.version) applyConfig(res.config, res.version);
      } catch (e) {
        /* server unreachable: keep what is on screen */
      }
      busy = false;
    }, 2000);
  }

  /* ==========================================================================
     10. Wiring
     ========================================================================== */
  function init() {
    hydratePhotos();
    hydrateIcons();
    chat.log.replaceChildren(h('p', { class: 'day-sep' }, 'היום'), chat.greeting);
    renderAll();

    $('card-ask').addEventListener('click', (e) => openSheet('chat', { opener: e.currentTarget, focus: 'input' }));
    $('bar-ask').addEventListener('click', (e) => openSheet('chat', { opener: e.currentTarget, focus: 'input' }));
    $('open-search').addEventListener('click', (e) => openSheet('search', { opener: e.currentTarget }));
    document.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', () => closeSheet()));
    scrim.addEventListener('click', () => closeSheet());
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && sheets.current) { e.preventDefault(); closeSheet(); } });
    document.querySelectorAll('.sheet').forEach(enableDragToClose);

    const input = $('compose-input');
    const send = $('send');
    input.addEventListener('input', () => { send.disabled = !input.value.trim(); });
    $('compose').addEventListener('submit', (e) => {
      e.preventDefault();
      ask(input.value);
      input.value = '';
      send.disabled = true;
      input.focus({ preventScroll: true });
    });

    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', syncViewport);
      window.visualViewport.addEventListener('scroll', syncViewport);
    }
    watchCard();
    setInterval(renderStatus, 60 * 1000);
    if (EMBED) listenToParent();
    else if (SERVER) pollConfig();

    if (START_SHEET) openSheet(START_SHEET, { instant: true, focus: EMBED ? 'none' : 'dialog' });
    else playIntro();
    postToParent({ type: 'ready' });
  }

  init();
})();
</script>
</body>
</html>
